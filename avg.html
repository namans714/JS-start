<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Average Marks</title>
</head>
<body>
    <div>
        <h2>Enter you marks out of 100 in each subjects:</h2>
        <input type="number" id="m1" placeholder="Marks scored in English">
        <input type="number" id="m2" placeholder="Marks scored in Maths">
        <input type="number" id="m3" placeholder="Marks scored in Science">

    <br><br>
        
    <button onclick="calculate('per')">Percentage</button>

    <p id="result"></p>
    </div>
    
    <script>

        function calculate(input) {
        let a = Number(document.getElementById("m1").value);
        let b = Number(document.getElementById("m2").value);
        let c = Number(document.getElementById("m3").value);
        let result;
        let grade;

            result=((a + b + c) / 300) * 100;
            if(result>=90){
                grade="A"
            }
            else if(result>=80){
                grade="B"
            }
            else if(result>=70){
                grade="C"
            }
            else{
                grade="D ~~ Fail"
            }
          document.getElementById("result").innerText = "Your Grade is " + grade + " and " + result + "%";
        }     
   </script>
</body>
