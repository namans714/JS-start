<!DOCTYPE html>
<html>
<head>
  <title>Bubble Sort</title>
</head>
<body>

  <h3>Enter array elements (comma separated)</h3>

  <input type="text" id="arrayInput" placeholder="e.g. 4,3,5,1,2,7,9">
  <br><br>

  <button onclick="sortArray()">Sort Array</button>

  <p id="result"></p>

  <script>
    function bubbleSort(arr) {
      let n = arr.length;

      for (let i = 0; i < n - 1; i++) {
        for (let j = 0; j < n - i - 1; j++) {
          if (arr[j] > arr[j + 1]) {
            let temp = arr[j];
            arr[j] = arr[j + 1];
            arr[j + 1] = temp;
          }
        }
      }
      return arr;
    }

    function sortArray() {
      let input = document.getElementById("arrayInput").value;

      // Convert input string to number array
      let arr = input.split(",").map(Number);

      let sortedArr = bubbleSort(arr);

      document.getElementById("result").innerText =
        "Sorted Array: " + sortedArr.join(", ");
    }
  </script>

</body>
</html>
